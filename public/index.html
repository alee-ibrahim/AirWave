<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AirWave</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style> body { place-items: center; } .card { text-align: center; } </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">AirWave</div>
    <h1>Tune in, live.</h1>
    <p class="sub">One person talks. Everyone else listens — even with the screen off.</p>

    <div class="btn-row">
      <button class="btn-listen" id="listen">Listen</button>
    </div>
  </div>

  <script>
    document.getElementById("listen").onclick = () => location.href = "listen";
  </script>
</body>
</html>
